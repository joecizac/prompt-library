<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Prompt Writer for Prompt Library</title>
    <link rel="stylesheet" href="styles.css?v=20260607-modal-1">
    <script>
      (function () {
        try {
          var storedTheme = localStorage.getItem("prompt-writer-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = storedTheme || (prefersDark ? "dark" : "light");
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <script src="app.js?v=20260607-modal-1" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-content">
        <div>
          <p class="eyebrow">SDLC Prompt Catalog</p>
          <h1>Prompt Writer</h1>
        </div>
        <button class="theme-toggle" type="button" id="themeToggle" aria-label="Switch to dark mode" title="Switch theme">
          <span class="theme-toggle__icon" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <main>
      <section class="toolbar" aria-labelledby="catalogTitle">
        <div>
          <h2 id="catalogTitle">Prompt templates by SDLC phase</h2>
          <p id="resultSummary" class="summary" aria-live="polite">Loading prompt templates...</p>
        </div>
        <form class="search-form" role="search">
          <label for="searchInput">Search by tag</label>
          <input
            id="searchInput"
            name="search"
            type="search"
            placeholder="Try discovery, testing, refactor"
            autocomplete="off"
            disabled
          >
        </form>
      </section>

      <section id="statusRegion" class="status-region" aria-live="polite">
        <p class="status-card">Loading prompt catalog...</p>
      </section>

      <section id="catalog" class="catalog" aria-label="Prompt catalog" hidden></section>
    </main>

    <div class="modal-backdrop" id="modalBackdrop" hidden></div>
    <section
      class="modal"
      id="templateModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
      hidden
    >
      <article class="modal__panel">
        <header class="modal__header">
          <div>
            <p class="modal__phase" id="modalPhase"></p>
            <h2 id="modalTitle">Prompt editor</h2>
          </div>
          <button class="icon-button" type="button" id="closeModal" aria-label="Close prompt editor">
            <span aria-hidden="true">x</span>
          </button>
        </header>

        <div class="modal__body">
          <section class="placeholder-column" aria-labelledby="placeholderTitle">
            <div class="modal-section-heading">
              <h3 id="placeholderTitle">Placeholders</h3>
              <ul class="tag-list" id="modalTags" aria-label="Template tags"></ul>
            </div>
            <form id="placeholderForm" class="placeholder-form"></form>
          </section>

          <section class="preview-column" aria-labelledby="previewTitle">
            <div class="section-heading">
              <h3 id="previewTitle">Prompt preview</h3>
              <button class="copy-button" type="button" id="copyPrompt">Copy</button>
            </div>
            <div id="promptPreview" class="prompt-preview" aria-label="Generated prompt preview"></div>
            <textarea id="generatedPrompt" class="visually-hidden" readonly aria-label="Generated prompt text"></textarea>
            <p class="feedback" id="copyFeedback" aria-live="polite"></p>
          </section>
        </div>
      </article>
    </section>
  </body>
</html>
